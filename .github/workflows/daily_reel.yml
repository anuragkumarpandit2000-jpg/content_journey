name: Daily Autonomous AI Reel Publisher

on:
  schedule:
    # Runs everyday at 12:30 UTC (6:00 PM IST)
    - cron: '30 12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI button anytime

permissions:
  contents: write # Needed to create GitHub release for public video CDN URL

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 📦 Install Dependencies
        run: |
          npm install
          pip install edge-tts

      - name: 🤖 Run Autonomous Reel Factory Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node pipeline/run_factory.mjs

      - name: 🌐 Create Release for Public Video URL & Direct Upload
        if: env.INSTAGRAM_ACCESS_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          LATEST_VIDEO=$(ls -td video#*/out/master_reel*.mp4 | head -1)
          TAG="reel-${{ github.run_id }}"
          gh release create "$TAG" "$LATEST_VIDEO" --title "Daily Reel $TAG" --notes "Auto-generated reel"
          PUBLIC_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename "$LATEST_VIDEO")"
          echo "Public CDN Video URL: $PUBLIC_URL"
          node pipeline/5_instagram_uploader.mjs "$LATEST_VIDEO" "$PUBLIC_URL"

      - name: 💾 Upload Generated Reel as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-reel
          path: video#*/out/*.mp4
          retention-days: 7
